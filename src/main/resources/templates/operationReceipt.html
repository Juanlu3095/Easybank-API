<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        /* SHARED PROPERTIES */
        .property-title{
            font-size: 16pt;
        }

        .property-value{
            font-size: 10pt;
        }

        body{
            margin: 0 5rem;
        }

        p{
            margin: 0.5pt 0;
        }

        /* HEADER */
        .logo-and-doc-name{
            margin: 2pt 0;
        }

        .logo-and-doc-name table{
            width: 100%;
        }

        .logo-and-doc-name table tr th{
            width: 50%;
        }

        .col-logo{
            text-align: left;
        }

        .col-title{
            text-align: right;
        }

        .logo-and-doc-name img{
            width: 200pt;
        }

        /* MAIN */
        .principal-data, .secondary-data{
            border: 2pt solid #197A69;
            padding: 10pt 3pt;
            margin: 20pt 0;
        }

        .principal-data table, .secondary-data table {
            width: 100%;
        }

        .principal-data table tr th,
        .principal-data table tr td,
        .secondary-data table tr th,
        .secondary-data table tr td{
            text-align: center;
            width:33%;
        }

        /* FOOTER */
        .contact-data{
            margin: 2pt 0;
            text-align: center;
        }
    </style>
    <title>Operation receipt</title>
</head>
<body>
    <div>
        <div class="logo-and-doc-name">
            <table>
                <tr>
                    <th class="col-logo">
                        <img src="https://raw.githubusercontent.com/Juanlu3095/Easybank-API/refs/heads/main/src/main/resources/logo/easybank_logo_no_background.png" alt="logo-easybank" />
                    </th>
                    <th class="col-title">
                        <h1 id="title">Operation receipt</h1>
                    </th>
                </tr>
            </table>
        </div>
    </div>

    <div>
        <div class="principal-data">
            <table class="principal-table">
                <tr>
                    <th><h3 class="property-title">Date &amp; time</h3></th>
                    <th><h3 class="property-title">Operation type</h3></th>
                    <th><h3 class="property-title">Status</h3></th>
                </tr>
                <tr>
                    <td><p class="property-value" th:text="${date_and_time}"></p></td>
                    <td><p class="property-value" th:text="${operationType}"></p></td>
                    <td><p class="property-value" th:text="${operationStatus}"></p></td>
                </tr>
            </table>
        </div>

        <div class="secondary-data">
            <table class="principal-table">
                <tr>
                    <th><h3 class="property-title">Operation details</h3></th>
                    <th><h3 class="property-title">Orderer</h3></th>
                    <th><h3 class="property-title">Beneficiary</h3></th>
                </tr>
                <tr>
                    <td><p class="property-value" th:text="${'Amount: ' + amount + '€'}"></p></td>
                    <td><p class="property-value" th:text="${orderer}"></p></td>
                    <td><p class="property-value"></p></td>
                </tr>
                <tr>
                    <td><p class="property-value" th:text="${'Operation reference: ' + operationId}"></p></td>
                    <td><p class="property-value" th:text="${ordererIban}">ES76 2100 0418 4012 3456 7891</p></td>
                    <td><p class="property-value" th:text="${beneficiaryIban}">ES24 0049 5199 3287 1781 0958</p></td>
                </tr>
                <tr>
                    <td><p class="property-value" th:text="${'Concept: ' + concept}"></p></td>
                    <td></td>
                    <td></td>
                </tr>
            </table>
        </div>
    </div>

    <div>
        <div class="contact-data">
            <p>EasyBank</p>
            <p>Telephone: +34 951111111   Email: info@easybank.com</p>
        </div>
    </div>
</body>
</html>
